<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>페이지를 찾을 수 없습니다 | 유니콘랩</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <meta name="theme-color" content="#16152E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .nf {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--navy);
      padding: 40px 24px;
    }
    .nf-lockup { height: 26px; width: auto; margin-bottom: 46px; opacity: .9; }
    .nf-code {
      font-family: var(--font-en);
      font-weight: 700;
      font-size: clamp(3.4rem, 11vw, 6rem);
      line-height: 1;
      color: var(--coral);
      letter-spacing: 0.02em;
    }
    .nf-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.3rem, 3.4vw, 1.9rem);
      color: #fff;
      margin: 22px 0 14px;
    }
    .nf-sub {
      font-family: var(--font-ui);
      font-size: 0.98rem;
      line-height: 1.85;
      color: rgba(255, 255, 255, 0.58);
      margin-bottom: 40px;
    }
  </style>
</head>
<body>
  <main class="nf">
    <img src="logo-lockup-inv.svg" alt="Unicorn Lab" class="nf-lockup" />
    <p class="nf-code">404</p>
    <h1 class="nf-title">페이지를 찾을 수 없습니다.</h1>
    <p class="nf-sub">
      주소가 바뀌었거나, 삭제된 페이지일 수 있습니다.<br />
      찾으시는 내용이 있다면 편하게 문의해 주세요.
    </p>
    <a href="./" class="btn-primary">홈으로 돌아가기 →</a>
  </main>
</body>
</html>
